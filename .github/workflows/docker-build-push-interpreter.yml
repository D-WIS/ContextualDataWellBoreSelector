name: Verify and publish contextual image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build DWIS.ContextualData.WellBoreSelector.sln -c Release
      - run: dotnet test DWIS.ContextualData.WellBoreSelector.sln -c Release --no-build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: WebApp/Dockerfile
          push: true
          tags: |
            digiwells/dwiscontextualdatawellboreselectorwebapp:stable
            digiwells/dwiscontextualdatawellboreselectorwebapp:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
